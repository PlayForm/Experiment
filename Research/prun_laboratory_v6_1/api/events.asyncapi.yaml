asyncapi: 3.1.0
info:
    title: Rust Lab Signed Event Bus
    version: 6.1.0
    description:
        Trusted event subscribers only. Signed audit-event payload is metadata-only;
        content stored in encrypted CAS and accessed by policy.
defaultContentType: application/json
channels:
    labCampaign:
        address: lab.v6.campaign
        messages:
            audit:
                $ref: "#/components/messages/AuditEvent"
        description: Read-only signed event stream, authorized subscriber only.
