openapi: 3.1.1
info:
    title: Rust Laboratory Trusted Internal API
    version: 6.1.0
    description:
        "mTLS service-to-service only. Model containers have no route, credentials,
        DNS context or API spec. v6.1: artifact sovereignty, non-disclosing worker boundary,
        emergent research and bitemporal transfer."
servers:
    - url: https://lab-core.lab.internal:9444
security:
    - serviceMutualTLS: []
components:
    securitySchemes:
        serviceMutualTLS:
            type: mutualTLS
paths:
    /internal/v1/worker/claim:
        post:
            operationId: claimWorkerTask
            summary: Trusted supervisor claims a scoped work order
            tags:
                - trusted-service
            parameters: []
            responses:
                "202":
                    description: Accepted asynchronously
                    content:
                        application/json:
                            schema:
                                $ref: ../schemas/ack.schema.json
                default:
                    description: Error
                    content:
                        application/json:
                            schema:
                                $ref: ../schemas/api-error.schema.json
            x-lab-roles:
                - supervisor
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: ../schemas/worker-claim-request.schema.json
    /internal/v1/worker/heartbeat:
