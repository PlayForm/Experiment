openapi: 3.1.1
info:
    title: Rust Laboratory External API
    version: 6.1.0
    description:
        "Observer and authenticated-operator interface. No LLM or model-runtime
        container is permitted to connect. v6.1: artifact sovereignty, non-disclosing
        worker boundary, emergent research and bitemporal transfer."
servers:
    - url: https://lab-ui.lab.internal:9443
      description:
          Human client endpoint; loopback or UDS transport is an allowed local
          alternative.
tags:
    - name: health
    - name: monitor
    - name: campaigns
    - name: experiments
    - name: mutations
    - name: research
    - name: evidence
    - name: workers
    - name: pki
    - name: telemetry
    - name: operator
security:
    - mutualTLS: []
components:
    securitySchemes:
        mutualTLS:
            type: mutualTLS
paths:
    /health/live:
        get:
            operationId: getLiveness
            summary: Is API process alive
            tags:
                - health
            parameters: []
            responses:
                "200":
                    description: Read-only projection
                    content:
                        application/json:
                            schema:
                                $ref: ../schemas/status.schema.json
                default:
                    description: Error
                    content:
                        application/json:
                            schema:
                                $ref: ../schemas/api-error.schema.json
            x-lab-roles:
                - observer
